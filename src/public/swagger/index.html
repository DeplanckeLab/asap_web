<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ASAP API Docs</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }
      /* Hide Try it out only for GET /projects.json */
      #operations-Projects-listProjectsJson .try-out__btn,
      #operations-Projects-listProjectsJson .execute-wrapper {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      const openApiUrl = "/swagger/openapi.yaml?v=" + Date.now();
      window.ui = SwaggerUIBundle({
        url: openApiUrl,
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis],
        docExpansion: "full",
        defaultModelsExpandDepth: 10,
        defaultModelExpandDepth: 10,
        displayRequestDuration: true,
        layout: "BaseLayout"
      });
    </script>
  </body>
</html>
