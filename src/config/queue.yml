default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: archive
      threads: 1
      processes: 1
      polling_interval: 0.5
    # Parsing / SLURM submit. Kept off the default worker so a job that polls for parse
    # (catalog import) cannot occupy a default thread and also claim the ProjectParsingJob
    # it is waiting on (queues: "*" would match pipeline too).
    - queues: pipeline
      threads: 3
      processes: 1
      polling_interval: 0.1
    # SLURM monitor / finish_run (may do loom I/O). Isolated so a hung finish cannot
    # starve ProjectParsingJob on the pipeline queue.
    - queues: pipeline_monitor
      threads: 3
      processes: 1
      polling_interval: 0.1
    - queues: default
      threads: 15
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
