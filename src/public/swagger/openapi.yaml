openapi: 3.0.3
info:
  title: ASAP API
  version: 1.0.0
  description: Swagger documentation for ASAP JSON endpoints.
servers:
  - url: /api
    description: Current environment
paths:
  /projects:
    get:
      summary: List projects
      description: |
        Canonical API endpoint.
        Returns the full public project catalog as JSON (prebuilt `projects.json` under `DATA_DIR`).

        Access URL (relative to the API server base above): `/projects`

        Example:
        `GET __ASAP_API_BASE__/projects`

        ```bash
        curl -H 'Accept: application/json' '__ASAP_API_BASE__/projects'
        ```

        Try it out is disabled here because the response is too large for the Swagger UI.
        Open the Access URL above in a browser or with curl.
      operationId: listProjectsApi
      tags:
        - Projects
      responses:
        '200':
          description: List of project exports.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectExport'
              examples:
                projectList:
                  summary: Project list
                  description: Truncated example for readability. Each project object includes many additional fields defined in `ProjectExport`.
                  value:
                    - public_key: "ASAP48"
                      key: "abc123"
                      doi: "10.1038/s41586-020-03188-8"
                      version: "v8"
                      organism: "Homo sapiens"
                      metadata_lists: []
                    - public_key: "ASAP50"
                      key: "def456"
                      version: "v8"
                      organism: "Mus musculus"
                      metadata_lists: []
        '404':
          description: Projects JSON file not found.
  /projects/{project_key}:
    get:
      summary: Get one project
      description: |
        Canonical API endpoint.
        Returns the project export payload generated by `Basic.generate_project_json`.
        The path parameter is resolved as project key or public id (for example `icmuj3` or `ASAP48`).
      operationId: getProjectApi
      tags:
        - Projects
      parameters:
        - name: project_key
          in: path
          required: true
          description: Project identifier (key, or public id format like `icmuj3` or `ASAP48`).
          schema:
            type: string
      responses:
        '200':
          description: Project JSON payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectExport'
              examples:
                projectExport:
                  summary: Example project export
                  value:
                    public_key: "ASAP48"
                    key: "abc123"
                    url: "https://example.org/projects/abc123"
                    json_url: "https://example.org/api/projects/abc123"
                    doi: "10.1038/s41586-020-03188-8"
                    asap_data_db: "asap_data_v8"
                    asap_data_db_url: "https://example.org/dumps/asap_data_v8.sql.gz"
                    version: "v8"
                    reproducibility_instructions_url: "https://example.org/projects/abc123/instructions"
                    reproducibility_script_url: "https://example.org/projects/abc123/get_commands"
                    nber_cols: 20000
                    nber_rows: 120000
                    reference:
                      doi: "10.1038/s41586-020-03188-8"
                      title: "A reference publication title"
                      authors: "Smith J, Doe A, et al."
                      first_author: "Smith J"
                      pmid: 12345678
                      year: 2021
                      volume: "12"
                      issue: "4"
                      abstract: "Publication abstract text."
                      published_at: "2021-02-10T00:00:00Z"
                    tissue: "brain"
                    technology: "scRNA-seq"
                    extra_info: "Example metadata"
                    tax_id: 9606
                    organism: "Homo sapiens"
                    project_type: "single-cell"
                    nber_cloned: 3
                    nber_views: 42
                    disk_size_archived: 123456789
                    project_cell_set_key: "default"
                    experiments:
                      - identifier_type: "GEO"
                        identifier: "GSE123456"
                        url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE123456"
                    metadata_lists:
                      - id: 101
                        run_id: 202
                        path: "/col_attrs/Cell_type"
                        run_pipeline:
                          - run_id: 202
                            step_id: 12
                            step_label: "clustering"
                            method_id: 34
                            method_label: "leiden"
                            num: 1
                            attrs: {}
                            command: "python run.py"
                            docker_repo: "dockerhub"
                            docker_image_url: "https://hub.docker.com/layers/fabdavid/asap_run/v5.1"
                            docker_image_name: "fabdavid/asap_run:v5.1"
                        annotations:
                          - id: 5501
                            num: 1
                            name: "Excitatory neuron"
                            cell_set_key: "cell_set_main"
                            comment: "Top marker genes support this label"
                            project_id: 42
                            clone_id: null
                            cat: "cell_type"
                            cat_idx: 3
                            cell_ontology_terms:
                              - identifier: "CL:0000540"
                                name: "neuron"
                                description: "A neural cell."
                                ontology: "Cell Ontology"
                            up_genes:
                              - name: "SLC17A7"
                                ensembl_id: "ENSG00000179520"
                                biotype: "protein_coding"
                                chr: "12"
                                ncbi_gene_id: "57030"
                                latest_ensembl_release: "110"
                                description: "solute carrier family 17 member 7"
                                function_description: "Vesicular glutamate transporter."
                                alt_names: "VGLUT1"
                            down_genes:
                              - name: "GAD1"
                                ensembl_id: "ENSG00000128683"
                                biotype: "protein_coding"
                                chr: "2"
                                ncbi_gene_id: "2571"
                                latest_ensembl_release: "110"
                                description: "glutamate decarboxylase 1"
                                function_description: "GABA synthesis enzyme."
                                alt_names: "GAD67"
                            orcid_user:
                              id: 77
                              nickname: "curator"
                            user_id: "curator@example.org"
                            source: "manual"
                            nber_agree: 15
                            nber_disagree: 2
                            score: 13
                            obsolete: false
                            created_at: "2026-03-26T17:00:00Z"
                            updated_at: "2026-03-26T17:30:00Z"
        '404':
          description: Project not found.
  /projects/{project_key}/data_file_metadata_catalog:
    get:
      summary: Get data file metadata catalog
      description: |
        Returns the cross-tool metadata catalog for one project data file (LOOM, H5AD, RDS, etc.).
        The catalog is intended for embedding in the file (location is format-specific) or exchange between tools.
        Payload is normalized as `list_of_projects`, `list_of_runs`, and `list_of_metadata`,
        where each metadata entry references pipeline runs through `pipeline_run_idx`.
        Shown in API documentation for admin users only.
      operationId: getDataFileMetadataCatalogApi
      tags:
        - Projects
      parameters:
        - name: project_key
          in: path
          required: true
          description: Project identifier (key, or public id format like `icmuj3` or `ASAP48`).
          schema:
            type: string
        - name: data_file
          in: query
          required: true
          description: Project-relative data file path (for example `parsing/output.loom` or `parsing/output.h5ad`). In the API documentation try-it-out form, this field is shown as a dropdown after `project_key` is set.
          schema:
            type: string
            example: parsing/output.loom
      responses:
        '200':
          description: Data file metadata catalog JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataFileMetadataCatalog'
        '400':
          description: Missing `data_file` query parameter.
        '404':
          description: Project or data file not found.
  /compliance/checks:
    get:
      summary: Lookup or run standalone scFAIR check by file URL
      description: |
        Canonical API endpoint.
        URL-only access to standalone (non-project) scFAIR compliance results.

        - When a matching check already exists, returns that result (200).
        - When no result exists yet, queues download+validation and returns 202.
        - Pass `recheck=1` to force a new validation even if a result already exists.

        Poll `status_url` from a 202 response, or call this endpoint again without
        `recheck` until a 200 result payload is returned.

        Access URL (relative to the API server base above): `/compliance/checks`

        Example:
        `GET __ASAP_API_BASE__/compliance/checks?source_url=https%3A%2F%2Fexample.com%2Fdataset.h5ad`

        ```bash
        curl -H 'Accept: application/json' \
          '__ASAP_API_BASE__/compliance/checks?source_url=https%3A%2F%2Fexample.com%2Fdataset.h5ad'
        ```

        Force recomputation:

        ```bash
        curl -H 'Accept: application/json' \
          '__ASAP_API_BASE__/compliance/checks?source_url=https%3A%2F%2Fexample.com%2Fdataset.h5ad&recheck=1'
        ```

        Add `download=1` on a completed lookup to receive the JSON as a file attachment.
      operationId: lookupStandaloneComplianceCheckApi
      tags:
        - Compliance
      parameters:
        - name: source_url
          in: query
          required: true
          description: Exact source file URL of the standalone check (catalog / remote URL). Required; filename-only lookup is not available on the API.
          schema:
            type: string
            format: uri
            example: https://example.com/dataset.h5ad
        - name: recheck
          in: query
          required: false
          description: When truthy (`1`, `true`), recompute validation instead of returning an existing stored result.
          schema:
            type: boolean
            example: false
        - name: schema_id
          in: query
          required: false
          description: Schema id used when starting a new validation (missing result or `recheck=1`). Defaults to the active scFAIR default.
          schema:
            type: string
            example: scfair_7_1_0
        - name: download
          in: query
          required: false
          description: When truthy (`1`, `true`) and a completed result is returned, send the JSON payload as a downloadable attachment.
          schema:
            type: boolean
            example: false
      responses:
        '200':
          description: Latest matching standalone compliance check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandaloneComplianceCheckLookup'
              examples:
                passedCheck:
                  summary: Passed standalone check
                  value:
                    id: 42
                    task_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    filename: "dataset.h5ad"
                    source_url: "https://example.com/dataset.h5ad"
                    schema_id: "scfair_7_1_0"
                    format: "h5ad"
                    passed: true
                    status: "completed"
                    checked_at: "2026-08-29T10:00:00Z"
                    admin_run: true
                    result:
                      valid: true
                      format: "h5ad"
                      schema_id: "scfair_7_1_0"
                      schema_version: "7.1.0"
                      validated_at: "2026-08-29T10:00:00Z"
                      errors: []
                      warnings: []
                      valid_checks:
                        - field: "obs/assay"
                          message: "ok"
                      summary:
                        errors_count: 0
        '202':
          description: Validation queued or still in progress for this URL. Poll `status_url` or retry this endpoint without `recheck` until a 200 result is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandaloneComplianceCheckAccepted'
              examples:
                queued:
                  summary: Validation started
                  value:
                    task_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    status: "downloading"
                    schema_id: "scfair_7_1_0"
                    fu_id: 123
                    source_url: "https://example.com/dataset.h5ad"
                    status_url: "/compliance/file-check/a1b2c3d4-e5f6-7890-abcd-ef1234567890/status"
                    message: "Validation in progress; poll status_url or this endpoint until results are available"
        '422':
          description: "`source_url` was missing or invalid."
components:
  schemas:
    StandaloneComplianceCheckAccepted:
      title: Standalone scFAIR compliance check accepted
      type: object
      description: |
        Returned with HTTP 202 when the API queues (or finds in-progress) download+validation
        for a `source_url` that has no stored result yet, or when `recheck=1` was requested.
      properties:
        task_id:
          type: string
          description: Async task id for status polling.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        status:
          type: string
          description: Current async status (for example `downloading` or `validating`).
          example: downloading
        schema_id:
          type: string
          description: Compliance schema identifier used for the run.
          example: scfair_7_1_0
        fu_id:
          type: integer
          description: Internal upload record id for the in-progress run.
          example: 123
        source_url:
          type: string
          format: uri
          description: Source URL being validated.
          example: https://example.com/dataset.h5ad
        status_url:
          type: string
          description: Relative URL to poll for download/validation progress.
          example: /compliance/file-check/a1b2c3d4-e5f6-7890-abcd-ef1234567890/status
        message:
          type: string
          description: Human-readable guidance for the client.
    StandaloneComplianceCheckLookup:
      title: Standalone scFAIR compliance check lookup
      type: object
      description: |
        Latest standalone (non-project) scFAIR check matching exact `source_url`.
        `result` is the stored compliance report JSON (field_values and checks_catalog are omitted).
      properties:
        id:
          type: integer
          description: Internal standalone check id.
          example: 42
        task_id:
          type: string
          description: Async task id used when the check was run.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        filename:
          type: string
          description: Original filename of the checked file.
          example: dataset.h5ad
        source_url:
          type: string
          format: uri
          description: Exact source URL of the checked file when the check was URL-based.
          example: https://example.com/dataset.h5ad
        schema_id:
          type: string
          description: Compliance schema identifier used for the check.
          example: scfair_7_1_0
        format:
          type: string
          description: Detected file format.
          enum:
            - h5ad
            - loom
          example: h5ad
        passed:
          type: boolean
          description: Whether the check passed overall.
          example: true
        status:
          type: string
          description: Check lifecycle status.
          enum:
            - completed
            - failed
          example: completed
        checked_at:
          type: string
          format: date-time
          description: When the check finished.
          example: "2026-08-29T10:00:00Z"
        admin_run:
          type: boolean
          description: Whether this check was recorded as an admin/batch run.
          example: true
        result:
          type: object
          description: Stored compliance report JSON for this check.
          additionalProperties: true
    DataFileMetadataCatalog:
      title: Data file metadata catalog
      type: object
      description: |
        Metadata catalog for one project data file.
        Projects and runs are de-duplicated, and each metadata entry references pipeline runs by index.
      properties:
        schema_version:
          type: string
          description: Catalog schema version.
          example: "1"
        data_file_url:
          type: string
          format: uri
          description: URL to download or access the data file in this project.
          example: https://example.org/projects/abc123/get_file?filename=parsing%2Foutput.loom
        data_file_type:
          type: string
          description: Data file format.
          enum:
            - LOOM
            - H5AD
            - RDS
          example: LOOM
        list_of_projects:
          type: array
          description: Projects/tools that contributed metadata in this catalog.
          items:
            $ref: '#/components/schemas/DataFileCatalogProject'
        list_of_runs:
          type: array
          description: Run pipeline entries ordered by run creation date.
          items:
            $ref: '#/components/schemas/DataFileCatalogRun'
        list_of_metadata:
          type: array
          description: Metadata columns described in this data file.
          items:
            $ref: '#/components/schemas/DataFileCatalogMetadata'
    DataFileCatalogProject:
      title: Data file catalog project
      type: object
      description: One project/tool identifier referenced by runs.
      properties:
        tool:
          type: string
          description: Name of the tool that produced metadata.
          example: ASAP
        identifier:
          type: string
          description: Project/tool-specific identifier.
          example: abc123
        url:
          type: string
          format: uri
          description: URL of the project HTML page.
          example: https://example.org/projects/abc123
        json_url:
          type: string
          format: uri
          description: URL of the project JSON export.
          example: https://example.org/api/projects/abc123
    DataFileCatalogRun:
      title: Data file catalog run
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          properties:
            project_idx:
              type: integer
              description: Index in `list_of_projects` for the project/tool owning this run.
              example: 0
    DataFileCatalogMetadata:
      title: Data file catalog metadata
      type: object
      description: One metadata column with annotation labels and indexed pipeline references.
      properties:
        id:
          type: integer
          description: ASAP annotation row identifier when produced on ASAP.
          example: 101
        run_id:
          type: integer
          description: ASAP run identifier that produced this metadata column.
          example: 202
        path:
          type: string
          description: Metadata column path within the data file.
          example: /col_attrs/Cell_type
        pipeline_run_idx:
          type: array
          description: Indexes in `list_of_runs` describing the pipeline that produced this metadata.
          items:
            type: integer
            example: 0
        annotations:
          type: array
          description: Community annotation labels for this metadata column.
          items:
            $ref: '#/components/schemas/AnnotationItem'
    ProjectExport:
      title: Project Export
      type: object
      description: |
        Full project export generated by `Basic.generate_project_json`.
        It includes project metadata, reproducibility links, source experiments, and metadata lists.
      properties:
        public_key:
          type: string
          description: Public identifier shown to users (for example `ASAP48`). Omitted when unavailable.
          example: ASAP48
        key:
          type: string
          description: Internal unique project key used in API routes.
          example: abc123
        url:
          type: string
          format: uri
          description: URL of the project HTML page.
          example: https://example.org/projects/abc123
        json_url:
          type: string
          format: uri
          description: URL of this project JSON export (`GET /api/projects/{project_key}`).
          example: https://example.org/api/projects/abc123
        doi:
          type: string
          description: Publication DOI attached to the project when available. Omitted when unavailable.
          example: 10.1038/s41586-020-03188-8
        asap_data_db:
          type: string
          description: Name of the ASAP data database version used by this project.
          example: asap_data_v8
        asap_data_db_url:
          type: string
          format: uri
          description: URL to download the SQL dump for reproducibility.
          example: https://example.org/dumps/asap_data_v8.sql.gz
        version:
          type: string
          description: ASAP pipeline version tag.
          example: v8
        reproducibility_instructions_url:
          type: string
          format: uri
          description: URL with reproducibility instructions for this project.
        reproducibility_script_url:
          type: string
          format: uri
          description: URL returning pipeline commands used for this project.
        nber_cols:
          type: integer
          description: Number of variables/features (typically genes). Omitted when unavailable.
          example: 20000
        nber_rows:
          type: integer
          description: Number of observations (typically cells). Omitted when unavailable.
          example: 120000
        reference:
          $ref: '#/components/schemas/ReferenceItem'
        tissue:
          type: string
          description: Tissue label associated with the dataset. Omitted when unavailable.
          example: brain
        technology:
          type: string
          description: Experimental technology. Omitted when unavailable.
          example: scRNA-seq
        extra_info:
          type: string
          description: Free-text project metadata. Omitted when unavailable.
        tax_id:
          type: integer
          description: NCBI taxonomy identifier of the organism. Omitted when unavailable.
          example: 9606
        organism:
          type: string
          description: Organism name.
          example: Homo sapiens
        cloned_project_id:
          type: integer
          description: Source project id when this project is cloned. Omitted when unavailable.
        project_type:
          type: string
          description: Human-readable project type label. Omitted when unavailable.
          example: single-cell
        nber_cloned:
          type: integer
          description: Number of times this project has been cloned. Omitted when unavailable.
        nber_views:
          type: integer
          description: Number of recorded project views. Omitted when unavailable.
        disk_size_archived:
          type: integer
          description: Archived project disk size in bytes. Omitted when unavailable.
        project_cell_set_key:
          type: string
          description: Key of the default project-level cell set. Omitted when unavailable.
        experiments:
          type: array
          description: Source experiment identifiers and URLs.
          items:
            $ref: '#/components/schemas/ProjectExperiment'
        metadata_lists:
          type: array
          description: List of metadata.
          items:
            $ref: '#/components/schemas/Metadata'
      additionalProperties: true
    ProjectExperiment:
      title: Project Experiment
      type: object
      description: External experiment accession attached to the project.
      properties:
        identifier_type:
          type: string
          description: Type of accession identifier.
          example: GEO
        identifier:
          type: string
          description: Identifier value.
          example: GSE123456
        url:
          type: string
          format: uri
          description: Direct link to the accession entry.
          example: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE123456
    Metadata:
      title: Metadata
      type: object
      description: Labels and provenance for one metadata column (for example cell type or cluster).
      properties:
        id:
          type: integer
          description: ASAP annotation row identifier for this metadata column.
          example: 101
        run_id:
          type: integer
          description: Run identifier that produced this metadata column on ASAP.
          example: 202
        path:
          type: string
          description: Metadata column path within the data file.
          example: /col_attrs/Cell_type
        run_pipeline:
          type: array
          description: Pipeline of runs that produced this metadata.
          items:
            $ref: '#/components/schemas/Run'
        annotations:
          type: array
          description: Individual annotation entries.
          items:
            $ref: '#/components/schemas/AnnotationItem'
    Run:
      title: Run
      type: object
      description: One step in the run pipeline that produced this metadata.
      properties:
        run_id:
          type: integer
          description: Run identifier.
          example: 202
        step_id:
          type: integer
          description: Pipeline step identifier.
          example: 12
        step_label:
          type: string
          description: Pipeline step label.
          example: clustering
        method_id:
          type: integer
          description: Method identifier.
          example: 34
        method_label:
          type: string
          description: Method label used in that step.
          example: leiden
        num:
          type: integer
          description: Optional step iteration number. Omitted when unavailable.
        attrs:
          type: object
          additionalProperties: true
          description: Method/run attributes serialized as key-value pairs.
        command:
          type: string
          description: Reconstructed command (not present for all steps). Omitted when unavailable.
        docker_repo:
          type: string
          description: Docker repository/provider label. Omitted when unavailable.
          example: dockerhub
        docker_image_url:
          type: string
          description: Docker Hub layers page URL for the image tag. Omitted when unavailable.
          example: https://hub.docker.com/layers/fabdavid/asap_run/v5.1
        docker_image_name:
          type: string
          description: Docker image name and tag when available. Omitted when unavailable.
          example: fabdavid/asap_run:v5.1
    AnnotationItem:
      title: Annotation Item
      type: object
      description: One annotation label entry inside `metadata_lists[].annotations`.
      properties:
        id:
          type: integer
          description: Annotation record identifier (`Cla.id`).
          example: 5501
        num:
          type: integer
          description: Annotation index/order used in the annotation group.
          example: 1
        name:
          type: string
          description: Human-readable annotation label.
          example: Excitatory neuron
        cell_set_key:
          type: string
          description: Cell set key linked to this annotation. Omitted when unavailable.
          example: cell_set_main
        comment:
          type: string
          description: Optional free-text comment added by curator. Omitted when unavailable.
        project_id:
          type: integer
          description: Project database identifier owning this annotation.
          example: 42
        clone_id:
          type: integer
          description: Parent annotation id when cloned. Omitted when unavailable.
        cat:
          type: string
          description: Annotation category label. Omitted when unavailable.
          example: cell_type
        cat_idx:
          type: integer
          description: Position/index inside category. Omitted when unavailable.
          example: 3
        cell_ontology_terms:
          type: array
          description: Cell ontology terms attached to this annotation.
          items:
            $ref: '#/components/schemas/CellOntologyTermRef'
        up_genes:
          type: array
          description: Genes enriched/up-regulated for this annotation. Omitted when unavailable.
          items:
            $ref: '#/components/schemas/GeneSummary'
        down_genes:
          type: array
          description: Genes down-regulated for this annotation. Omitted when unavailable.
          items:
            $ref: '#/components/schemas/GeneSummary'
        orcid_user:
          type: object
          description: ORCID user object linked to annotation author when available.
          additionalProperties: true
        user_id:
          type: string
          description: Email of the user linked to this annotation. Omitted when unavailable.
          example: curator@example.org
        source:
          type: string
          description: Annotation source label.
          example: manual
        nber_agree:
          type: integer
          description: Number of agree votes.
          example: 15
        nber_disagree:
          type: integer
          description: Number of disagree votes.
          example: 2
        score:
          type: integer
          description: Annotation score (`nber_agree - nber_disagree`).
          example: 13
        obsolete:
          type: boolean
          description: Whether this annotation is obsolete.
          example: false
        created_at:
          type: string
          format: date-time
          description: Creation timestamp.
          example: "2026-03-26T17:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp.
          example: "2026-03-26T17:30:00Z"
    CellOntologyTermRef:
      title: Cell Ontology Term
      type: object
      description: One cell ontology term linked to an annotation.
      properties:
        identifier:
          type: string
          description: Ontology identifier.
          example: CL:0000540
        name:
          type: string
          description: Ontology term name.
          example: neuron
        description:
          type: string
          description: Ontology term description.
        ontology:
          type: string
          description: Ontology namespace/name.
          example: Cell Ontology
    GeneSummary:
      title: Gene Summary
      type: object
      description: Gene fields returned for `up_genes` and `down_genes`.
      properties:
        name:
          type: string
          description: Gene symbol/name.
          example: SLC17A7
        ensembl_id:
          type: string
          description: Ensembl gene identifier.
          example: ENSG00000179520
        biotype:
          type: string
          description: Ensembl biotype.
          example: protein_coding
        chr:
          type: string
          description: Chromosome.
          example: "12"
        ncbi_gene_id:
          type: string
          description: NCBI Gene identifier.
          example: "57030"
        latest_ensembl_release:
          type: string
          description: Latest Ensembl release used for this entry.
          example: "110"
        description:
          type: string
          description: Gene description.
        function_description:
          type: string
          description: Functional summary text.
        alt_names:
          type: string
          description: Alternative gene names/aliases.
    ReferenceItem:
      title: Reference Item
      type: object
      description: Publication metadata linked to project `doi`. Omitted when unavailable.
      properties:
        doi:
          type: string
          description: Publication DOI.
          example: 10.1038/s41586-020-03188-8
        pmid:
          type: integer
          description: PubMed identifier.
          example: 12345678
        title:
          type: string
          description: Publication title.
          example: A reference publication title
        authors:
          type: string
          description: Author list as display string.
          example: Smith J, Doe A, et al.
        authors_json:
          type: string
          description: Raw serialized authors payload when stored.
        first_author:
          type: string
          description: First author display value.
          example: Smith J
        year:
          type: integer
          description: Publication year.
          example: 2021
        volume:
          type: string
          description: Journal volume.
          example: "12"
        issue:
          type: string
          description: Journal issue.
          example: "4"
        abstract:
          type: string
          description: Publication abstract.
        published_at:
          type: string
          format: date-time
          description: Publication date/time when available.
          example: "2021-02-10T00:00:00Z"
        journal_id:
          type: integer
          description: Internal journal identifier.
        created_at:
          type: string
          format: date-time
          description: Record creation timestamp.
        updated_at:
          type: string
          format: date-time
          description: Record update timestamp.
