# Database Data Updates
# This file stores database record updates that can be reapplied after a database refresh
# Run with: rails db:apply_data_updates

# Format:
# - model: ModelName (e.g., Project, Step, User)
#   find_by: { field: value }  # Hash of fields to find the record (e.g., { id: 1 } or { key: 'project_key' })
#   updates: { field: new_value }  # Hash of fields to update

# Example updates:
# - model: Project
#   find_by: { id: 1 }
#   updates:
#     name: "Updated Project Name"
#     description: "Updated description"
#
# - model: Step
#   find_by: { name: "parsing", docker_image_id: 5 }
#   updates:
#     label: "Updated Step Label"
#     hidden: false
#
# - model: User
#   find_by: { email: "user@example.com" }
#   updates:
#     admin: true

# Add your updates below:

- model: Step
  find_by: { name: "parsing" }
  updates:
    has_std_view: false

- model: Step
  find_by: { name: "doublet_calling" }
  updates:
    has_std_view: false

# PCA step was stored with docker_image_id 2 while the ASAP run image in use is 3.
# prepare_steps_with_status only loads steps for Basic.get_asap_docker(project.version),
# so a mismatched docker_image_id hides PCA from the pipeline panel. Skips if already fixed.
- model: Step
  find_by:
    id: 72
    name: "pca"
    docker_image_id: 2
  updates:
    docker_image_id: 3

# Bulk gene filtering methods had malformed command_json (missing comma after --output_meta).
- model: StdMethod
  find_by: { id: 307, name: "min_counts" }
  updates:
    command_json: '{"program":"Rscript --vanilla filtering.bulk.v8.R","opts":[{"opt":"-f","param_key":"input_matrix_filename"},{"opt":"--input_meta","param_key":"input_matrix_dataset"},{"opt":"--output_meta","value":"/row_attrs/_gene_filter_#{run_num}_#{std_method_name}"},{"opt":"-o","param_key":"output_dir"},{"opt":"--method","value":"min_counts"},{"opt":"--min_counts","param_key":"min_counts"},{"opt":"--min_samples","param_key":"min_samples"}],"predict_params":["nber_cols","nber_rows","std_method_name"]}'

- model: StdMethod
  find_by: { id: 308, name: "cpm" }
  updates:
    command_json: '{"program":"Rscript --vanilla filtering.bulk.v8.R","opts":[{"opt":"-f","param_key":"input_matrix_filename"},{"opt":"--input_meta","param_key":"input_matrix_dataset"},{"opt":"--output_meta","value":"/row_attrs/_gene_filter_#{run_num}_#{std_method_name}"},{"opt":"-o","param_key":"output_dir"},{"opt":"--method","value":"cpm"},{"opt":"--min_cpm","param_key":"min_cpm"},{"opt":"--min_samples","param_key":"min_samples"}],"predict_params":["nber_cols","nber_rows","std_method_name"]}'
    attrs_json: '{"input_matrix":{"valid_types":[["dataset"],["int_matrix","num_matrix"]]},"min_cpm":{"widget":"textfield","description":"Minimum CPM for a gene to be called \"expressed\".","label":"Min CPM","type":"int","min_val":0,"max_val":null,"default":1},"min_samples":{"widget":"textfield","description":"Minimum number of samples a gene must be expressed in. Genes not called expressed in a sufficient number of cells will be removed.","label":"Min Detected","type":"int","min_val":0,"max_val":null,"default":4}}'

# Bulk clustering: --filter_meta is auto-filled from gene_filtering lineage (see Basic.filter_mdata_from_lineage).
- model: StdMethod
  find_by: { id: 301, name: "kmeans" }
  updates:
    command_json: '{"program":"Rscript --vanilla clustering.bulk.v8.R","opts":[{"opt":"-f","param_key":"input_matrix_filename"},{"opt":"-o","param_key":"output_dir"},{"opt":"--method","param_key":"std_method_name"},{"opt":"--input_meta","param_key":"input_matrix_dataset"},{"opt":"--output_meta","param_key":"output_mdata","value":"/col_attrs/_#{step_tag}_#{std_method_name}"},{"opt":"-k","param_key":"nb_clust"},{"opt":"--nstart","param_key":"nstart"},{"opt":"--filter_meta","param_key":"filter_mdata","omit_when_null":true}],"predict_params":["nber_cols","nber_rows","std_method_name","nb_clust"]}'

- model: StdMethod
  find_by: { id: 302, name: "hclust" }
  updates:
    command_json: '{"program":"Rscript --vanilla clustering.bulk.v8.R","opts":[{"opt":"-f","param_key":"input_matrix_filename"},{"opt":"-o","param_key":"output_dir"},{"opt":"--method","param_key":"std_method_name"},{"opt":"--input_meta","param_key":"input_matrix_dataset"},{"opt":"--output_meta","param_key":"output_mdata","value":"/col_attrs/_#{step_tag}_#{std_method_name}"},{"opt":"-k","param_key":"nb_clust"},{"opt":"--filter_meta","param_key":"filter_mdata","omit_when_null":true}],"predict_params":["nber_cols","nber_rows","std_method_name","nb_clust"]}'

# Seurat scaling (v8): command_json had a typo {"opt : "--input_meta" ...} (missing closing quote on opt key).
# omit_when_null on --vars_to_regress so the flag is omitted when no covariates are selected.
- model: StdMethod
  find_by: { id: 347, name: "seurat" }
  updates:
    command_json: '{"program":"Rscript --vanilla scaling.v8.R","opts":[{"opt":"--method","value":"ScaleData"},{"opt":"-f","param_key":"input_matrix_filename"},{"opt":"--input_meta","param_key":"input_matrix_dataset"},{"opt":"--output_meta","param_key":"output_matrix_dataset","value":"/layers/#{step_tag}_#{std_method_name}"},{"opt":"-o","param_key":"output_dir"},{"opt":"--do_scale","param_key":"do_scale"},{"opt":"--do_center","param_key":"do_center"},{"opt":"--vars_to_regress","param_key":"covariates","omit_when_null":true}],"predict_params":["nber_cols","nber_rows","std_method_name"]}'
    attrs_json: '{"do_scale":{"description":"Whether to scale the data.","label":"Scale","type":"bool","widget":"checkbox","default":true},"do_center":{"description":"Whether to center the data.","label":"Center","type":"bool","widget":"checkbox","default":true},"covariates":{"label":"Covariates to regress out","description":"Variables to regress out. For example, nUMI, or percent.mito.","widget":"input_data","valid_types":[["dataset"],["col_mdata"],["discrete_mdata","numeric_mdata"]],"default":null,"dataset_field":"output_dataset","constraints":{"in_loom":["input_matrix"]},"requires":["input_matrix"],"source_steps":["import_metadata","parsing","cell_filtering","gene_filtering"],"req_data_structure":"array","min_nber_items":0,"optional":true}}'

# Scaling run panel omitted card-results from show_view_json, so output annots were never shown in Results.
- model: Step
  find_by: { id: 119, name: "scaling" }
  updates:
    show_view_json: |
      [
        {
          "horiz_elements": [
            {
              "id": "card-params",
              "type": "card",
              "class": "h-100",
              "container_class": "col-md-4"
            },
            {
              "id": "card-downloads",
              "type": "card",
              "class": "h-100",
              "container_class": "col-md-8"
            }
          ]
        },
        {
          "horiz_elements": [
            {
              "id": "card-results",
              "type": "card",
              "class": "h-100",
              "container_class": "col-md-12"
            }
          ]
        },
        {
          "admin": false,
          "horiz_elements": [
            {
              "id": "card-exec_stdout",
              "type": "card",
              "class": "h-100",
              "container_class": "col-md-6",
              "output_name": "exec_stdout",
              "title": "Docker execution STDOUT",
              "partial": "text_file_content",
              "admin": true
            },
            {
              "id": "card-exec_stderr",
              "type": "card",
              "class": "h-100",
              "container_class": "col-md-6",
              "output_name": "exec_stderr",
              "title": "Docker execution STDERR",
              "partial": "text_file_content",
              "admin": true
            }
          ]
        },
        {
          "admin": true,
          "horiz_elements": [
            {
              "id": "card-log",
              "type": "card",
              "class": "h-100",
              "container_class": "col-md-12",
              "output_name": "output_log",
              "title": "Log file",
              "partial": "text_file_content",
              "admin": true
            }
          ]
        }
      ]

# Module score: global gene sets via -geneset/-h, or loom row metadata via -metadata/-sel.
- model: Step
  find_by: { id: 122, name: "module_score" }
  updates:
    method_attrs_json: '{"input_matrix":{"label":"Input matrix","widget":"input_data","valid_types":[["dataset"],["int_matrix","num_matrix"]],"source_steps":["parsing","cell_filtering","gene_filtering","normalization","scaling","dim_reduction"],"combinatorial_runs":true,"req_data_structure":"array","constraints":{},"min_nber_items":1},"geneset_source":{"label":"Gene set source","widget":"select","list":[["Global database","global"],["Loom row metadata","loom"]],"default":"global","not_null":true,"requires":["input_matrix"]},"global_gene_set_collection_id":{"label":"Gene set collection","widget":"select","list":[],"requires":["geneset_source"],"constraints":{"visible_if":[{"attr":"geneset_source","equals":"global"}],"required_if":[{"attr":"geneset_source","equals":"global"}]}},"global_gene_set_item_id":{"label":"Gene set","widget":"input_gene_set_item","requires":["global_gene_set_collection_id"],"constraints":{"visible_if":[{"attr":"geneset_source","equals":"global"}],"required_if":[{"attr":"geneset_source","equals":"global"}]}},"geneset":{"widget":"input_data","label":"Gene set metadata","valid_types":[["dataset"],["row_mdata"],["discrete_mdata"]],"default":null,"dataset_field":"output_dataset","constraints":{"in_loom":["input_matrix"],"visible_if":[{"attr":"geneset_source","equals":"loom"}],"required_if":[{"attr":"geneset_source","equals":"loom"}]},"requires":["input_matrix","geneset_source"],"source_steps":["import_metadata","parsing","cell_filtering","gene_filtering"],"req_data_structure":"array","max_nber_items":1,"min_nber_items":1,"optional":true},"geneset_sel":{"label":"Gene set category","widget":"select","requires":["geneset"],"constraints":{"visible_if":[{"attr":"geneset_source","equals":"loom"}],"required_if":[{"attr":"geneset_source","equals":"loom"}]}},"n_bins":{"label":"Number of bins","widget":"select","min_val":1,"max_val":100,"default":24},"n_background_genes":{"label":"Number of background genes","widget":"select","min_val":1,"max_val":500,"defaul