# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  reclaim_stuck_solid_queue_jobs:
    class: ReclaimStuckSolidQueueJobsJob
    queue: default
    schedule: every hour at minute 42
  # Catalog imports left waiting for an H5AD matrix choice: delete the download, free the candidate.
  release_expired_catalog_matrix_choices:
    command: "ExternalCatalogCandidate.release_expired_matrix_choices!"
    schedule: every hour at minute 27

development:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  reclaim_stuck_solid_queue_jobs:
    class: ReclaimStuckSolidQueueJobsJob
    queue: default
    schedule: every hour at minute 42
  release_expired_catalog_matrix_choices:
    command: "ExternalCatalogCandidate.release_expired_matrix_choices!"
    schedule: every hour at minute 27
