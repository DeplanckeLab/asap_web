<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lasso Drawing Test</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    #canvas {
      border: 2px solid #333;
      cursor: crosshair;
      display: block;
      margin: 20px 0;
    }
    #info {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .stats {
      display: inline-block;
      margin-right: 20px;
      padding: 5px 10px;
      background: white;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h1>Lasso Drawing Test</h1>
  
  <div id="info">
    <div class="stats">Browser: <span id="browser">-</span></div>
    <div class="stats">Mode: <span id="mode">-</span></div>
    <div class="stats">Points: <span id="pointCount">0</span></div>
    <div class="stats">Events: <span id="eventCount">0</span></div>
    <div class="stats">Coalesced: <span id="coalescedCount">0</span></div>
    <div class="stats">FPS: <span id="fps">0</span></div>
  </div>
  
  <canvas id="canvas" width="800" height="600"></canvas>
  
  <div id="log" style="max-height: 200px; overflow-y: auto; background: #f9f9f9; padding: 10px; border: 1px solid #ddd; font-size: 12px; font-family: monospace;"></div>

  <script>
    const canvas = document.getElementById('canvas')
    const ctx = canvas.getContext('2d')
    
    // Detect browser
    const isFirefox = navigator.userAgent.toLowerCase().indexOf('firefox') > -1
    const isChrome = navigator.userAgent.toLowerCase().indexOf('chrome') > -1
    document.getElementById('browser').textContent = isFirefox ? 'Firefox' : (isChrome ? 'Chrome' : 'Other')
    
    let isDrawing = false
    let points = []
    let eventCount = 0
    let totalCoalesced = 0
    let lastFpsUpdate = Date.now()
    let fpsCounter = 0
    
    // Firefox polling mode
    let lastMouseX = 0
    let lastMouseY = 0
    let pollInterval = null
    
    function log(message) {
      const logDiv = document.getElementById('log')
      const entry = document.createElement('div')
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`
      logDiv.insertBefore(entry, logDiv.firstChild)
      
      // Keep only last 50 logs
      while (logDiv.children.length > 50) {
        logDiv.removeChild(logDiv.lastChild)
      }
    }
    
    function updateStats() {
      document.getElementById('pointCount').textContent = points.length
      document.getElementById('eventCount').textContent = eventCount
      document.getElementById('coalescedCount').textContent = totalCoalesced
      
      fpsCounter++
      const now = Date.now()
      if (now - lastFpsUpdate > 1000) {
        document.getElementById('fps').textContent = fpsCounter
        fpsCounter = 0
        lastFpsUpdate = now
      }
    }
    
    function drawLasso() {
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      
      if (points.length < 2) return
      
      ctx.strokeStyle = '#3b82f6'
      ctx.lineWidth = 2
      ctx.fillStyle = 'rgba(59, 130, 246, 0.1)'
      
      ctx.beginPath()
      ctx.moveTo(points[0].x, points[0].y)
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y)
      }
      ctx.stroke()
      ctx.fill()
    }
    
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect()
      const x = e.clientX - rect.left
      const y = e.clientY - rect.top
      
      isDrawing = true
      points = [{x, y}]
      eventCount = 0
      totalCoalesced = 0
      
      log(`Started lasso at (${x.toFixed(0)}, ${y.toFixed(0)})`)
      
      // Firefox polling workaround
      if (isFirefox) {
        document.getElementById('mode').textContent = 'Firefox Polling (60fps)'
        log('Using Firefox polling mode')
        
        lastMouseX = e.clientX
        lastMouseY = e.clientY
        
        // Track mouse position globally
        const mouseTracker = (evt) => {
          lastMouseX = evt.clientX
          lastMouseY = evt.clientY
        }
        document.addEventListener('pointermove', mouseTracker, { capture: true })
        document.addEventListener('mousemove', mouseTracker, { capture: true })
        
        // Poll at 60fps
        pollInterval = setInterval(() => {
          if (!isDrawing) return
          
          const x = lastMouseX - rect.left
          const y = lastMouseY - rect.top
          
          const lastPoint = points[points.length - 1]
          const dx = x - lastPoint.x
          const dy = y - lastPoint.y
          const distance = Math.sqrt(dx*dx + dy*dy)
          
          if (distance > 2) {
            points.push({x, y})
            drawLasso()
            updateStats()
          }
        }, 16) // ~60fps
        
        // Cleanup function
        canvas.pollingCleanup = () => {
          if (pollInterval) clearInterval(pollInterval)
          document.removeEventListener('pointermove', mouseTracker, { capture: true })
          document.removeEventListener('mousemove', mouseTracker, { capture: true })
        }
      } else {
        document.getElementById('mode').textContent = 'Coalesced Events'
      }
      
      drawLasso()
      updateStats()
    })
    
    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing || isFirefox) return
      
      eventCount++
      
      // Get coalesced events
      const coalescedEvents = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]
      totalCoalesced += coalescedEvents.length
      
      if (coalescedEvents.length > 1) {
        log(`Got ${coalescedEvents.length} coalesced events!`)
      }
      
      const rect = canvas.getBoundingClientRect()
      
      // Process all coalesced events
      for (const evt of coalescedEvents) {
        const x = evt.clientX - rect.left
        const y = evt.clientY - rect.top
        
        const lastPoint = points[points.length - 1]
        const dx = x - lastPoint.x
        const dy = y - lastPoint.y
        const distance = Math.sqrt(dx*dx + dy*dy)
        
        if (distance > 0.5) {
          points.push({x, y})
        }
      }
      
      drawLasso()
      updateStats()
    })
    
    canvas.addEventListener('pointerup', (e) => {
      if (!isDrawing) return
      
      isDrawing = false
      
      // Clean up Firefox polling
      if (canvas.pollingCleanup) {
        canvas.pollingCleanup()
        canvas.pollingCleanup = null
        log('Stopped Firefox polling')
      }
      
      log(`Completed lasso with ${points.length} points from ${eventCount} callbacks`)
      
      updateStats()
    })
    
    log('Lasso test ready! Click and drag to draw.')
    log(`Browser detected: ${isFirefox ? 'Firefox (will use polling)' : 'Chrome/Other (will use coalesced events)'}`)
  </script>
</body>
</html>
